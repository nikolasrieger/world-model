command: train
# null inherits checkpoint metadata, or legacy Pong defaults for a new run.
env_id: null
image_size: null
full_action_space: null
device: cpu
seed: 0
num_threads: 1

# null uses the checkpoint's data path, or the model's default cache.
data: null
# null saves inside Hydra's unique run directory.
output: null
resume: null
samples: 100000
collect_more: 0
epochs: 30
max_updates: null

# null preserves checkpoint settings on resume, otherwise model defaults.
batch_size: null
sequence_length: null
free_nats: null
history: 5
horizon: 5
eval_every: 250
val_windows: 128

# Sampling seeds for command=diagnose (MLP uses only the first).
diagnostic_seeds: [0, 1, 2]

# Checkpoint for command=gif or command=diagnose.
ckpt: null
mode: open-loop

hydra:
  job:
    chdir: false
  run:
    dir: artifacts/runs/${model.name}/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
  sweep:
    dir: artifacts/multirun/${model.name}/${now:%Y-%m-%d}/${now:%H-%M-%S-%f}
    subdir: ${hydra.job.num}
